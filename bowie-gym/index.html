<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e7cc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141019" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bowie Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Bowie Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Silkscreen&display=swap">
<style>
/* Layout: a cozy game "room" with Bowie up top, then the week card, chunky wooden tabs, and exercise cards. Rest timer slides up from the bottom. */
:root{
  --bg:#f6e7cc; --wall:#fbefd9; --floor:#f0d6ab; --floor-line:#e3c28e;
  --panel:#fffaf1; --panel-2:#fdf1dc; --edge:#ead7b7;
  --wood:#8b5a3c; --wood-dark:#6b4229; --wood-hi:#a8744f;
  --leaf:#a8cc86; --leaf-deep:#6e9a4c; --leaf-soft:#dcebc9;
  --honey:#f3a93a; --honey-soft:#fde2b3;
  --blush:#f3a1a6; --sky:#bcdcf7; --glass:#e9f4fd;
  --ink:#3d2a1f; --muted:#8b7563; --on-wood:#fff4e4;
  --mochi:#fffdf8; --mochi-shade:#eadccb; --gold:#c9924f; --gold-hi:#ecc58f;
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --wall:#1d1824; --floor:#2a2029; --floor-line:#382a33;
  --panel:#221c29; --panel-2:#2a2332; --edge:#3a3044;
  --wood:#6a4330; --wood-dark:#4d2f20; --wood-hi:#83573f;
  --leaf:#86b56c; --leaf-deep:#a6d487; --leaf-soft:#2d3a28;
  --honey:#f2b04c; --honey-soft:#4a3620;
  --blush:#e98a95; --sky:#27345a; --glass:#1a2240;
  --ink:#f4eadc; --muted:#ab9d90; --on-wood:#fff1de;
  --mochi:#f7f1e8; --mochi-shade:#cdbfae; --gold:#b98446; --gold-hi:#deb57e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --wall:#1d1824; --floor:#2a2029; --floor-line:#382a33;
  --panel:#221c29; --panel-2:#2a2332; --edge:#3a3044;
  --wood:#6a4330; --wood-dark:#4d2f20; --wood-hi:#83573f;
  --leaf:#86b56c; --leaf-deep:#a6d487; --leaf-soft:#2d3a28;
  --honey:#f2b04c; --honey-soft:#4a3620;
  --blush:#e98a95; --sky:#27345a; --glass:#1a2240;
  --ink:#f4eadc; --muted:#ab9d90; --on-wood:#fff1de;
  --mochi:#f7f1e8; --mochi-shade:#cdbfae; --gold:#b98446; --gold-hi:#deb57e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 140px;display:flex;flex-direction:column;gap:16px}

/* ---------- Room ---------- */
.room{position:relative;height:300px;border-radius:24px;overflow:hidden;background:var(--wall);border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge)}
.room .floor{position:absolute;inset:auto 0 0 0;height:42%;background:
  repeating-linear-gradient(90deg,transparent 0 96px,var(--floor-line) 96px 99px),
  linear-gradient(var(--floor-line),var(--floor-line)) 0 50%/100% 3px no-repeat,var(--floor)}
.window{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:120px;height:120px;border-radius:10px;border:6px solid var(--panel);background:linear-gradient(var(--glass),var(--sky));box-shadow:0 0 0 3px var(--edge)}
.window::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--panel),var(--panel)) 50% 0/6px 100% no-repeat,linear-gradient(var(--panel),var(--panel)) 0 50%/100% 6px no-repeat}
.moon{position:absolute;top:16px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--honey-soft);box-shadow:inset -6px -3px 0 var(--sky);opacity:.95}
.curtain{position:absolute;top:0;width:58px;height:190px;background:linear-gradient(90deg,var(--leaf),var(--leaf-deep) 40%,var(--leaf) 70%);border-radius:0 0 30px 30px;opacity:.9}
.curtain.l{left:-8px;border-bottom-right-radius:60px}
.curtain.r{right:-8px;border-bottom-left-radius:60px}
.curtain::after{content:"";position:absolute;top:118px;left:0;right:0;height:14px;background:var(--leaf-deep)}

.lvcard{position:absolute;top:14px;left:14px;z-index:2;background:var(--panel);border:3px solid var(--edge);border-radius:16px;padding:8px 10px;width:132px;display:flex;flex-direction:column;gap:5px}
.lvrow{display:flex;align-items:center;gap:6px}
.lv{font-family:var(--f-pixel);font-size:12px;color:var(--wood);background:var(--honey-soft);border-radius:6px;padding:1px 5px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--panel-2);border:2px solid var(--wood);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(var(--honey-soft),var(--honey));border-radius:99px;transition:width .4s}
.pet{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1}
.lvcard small{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted)}
.lvcard b{font-family:var(--f-display);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.lvcard b em{font-style:normal;color:var(--honey)}
.outfit-btn{display:flex;align-items:center;gap:6px;width:100%;border:2px solid var(--leaf-deep);border-radius:9px;padding:5px 7px;background:var(--leaf-soft);color:var(--leaf-deep);font-family:var(--f-display);font-weight:700;font-size:11px;text-align:left;box-shadow:0 2px 0 var(--leaf-deep);transition:transform .08s,background .15s}
.outfit-btn:hover{background:var(--honey-soft)}
.outfit-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--leaf-deep)}
.outfit-btn:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.outfit-swatch-mini{width:18px;height:18px;flex:none;border:2px solid rgba(61,42,31,.25);border-radius:6px;background:linear-gradient(135deg,var(--outfit-light),var(--outfit-mid) 55%,var(--outfit-dark))}
.outfit-copy{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.outfit-copy small{font-size:9px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.outfit-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outfit-arrow{margin-left:auto;font-size:16px;line-height:1}
.outfit-sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:end center;padding:16px;background:rgba(61,42,31,.32)}
.outfit-sheet[hidden]{display:none}
.outfit-panel{width:min(100%,480px);background:var(--panel);border:3px solid var(--edge);border-radius:22px;box-shadow:0 8px 0 var(--edge);padding:16px;animation:up .25s ease}
.outfit-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.outfit-head h2{font-size:20px}
.outfit-close{border:0;background:var(--panel-2);border-radius:10px;padding:6px 10px;font-weight:700}
.outfits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outfit-option{position:relative;border:2px solid var(--edge);border-radius:14px;background:var(--panel-2);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.outfit-option[aria-pressed="true"]{border-color:var(--honey);box-shadow:inset 0 0 0 2px var(--honey-soft)}
.outfit-option:disabled{cursor:not-allowed;opacity:.58}
.outfit-swatch{height:28px;border-radius:8px;background:linear-gradient(135deg,var(--outfit-light),var(--outfit-mid) 55%,var(--outfit-dark));border:2px solid rgba(61,42,31,.2)}
.outfit-option b{font-family:var(--f-display);font-size:14px}
.outfit-option small{color:var(--muted);font-size:11px}
.outfit-check{position:absolute;top:8px;right:8px;color:var(--honey);font-weight:800}

.bubble{position:absolute;right:12px;top:14px;z-index:2;max-width:150px;background:var(--panel);border:3px solid var(--edge);border-radius:16px;padding:7px 10px;font-family:var(--f-display);font-weight:600;font-size:13.5px;line-height:1.25}
.bubble::after{content:"";position:absolute;left:22px;bottom:-10px;border:8px solid transparent;border-top-color:var(--edge);border-bottom:0}
.bubble.pop{animation:pop .35s ease}

.stage{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:190px;height:190px;display:grid;place-items:end center}
.rug{position:absolute;bottom:0;width:190px;height:54px;border-radius:50%;border:3px dashed var(--honey);opacity:.6}
.mochi{position:relative;width:156px;height:168px;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
.mochi[role="button"]{cursor:pointer}
.mochi canvas{display:block;width:156px;height:168px;image-rendering:pixelated;image-rendering:crisp-edges}
.mochi.hop{animation:hop .6s ease}
.mochi.cheer{animation:cheer 1s ease 2}
.mochi canvas[hidden],.zzz[hidden]{display:none}
.zzz{position:absolute;top:62px;right:26px;width:0;height:0;z-index:1;pointer-events:none}
.zzz b{position:absolute;left:0;bottom:0;font-family:var(--f-pixel);font-weight:400;color:var(--wood);text-shadow:2px 2px 0 var(--panel);opacity:.9;animation:floatZ 2.4s ease-out infinite}
.zzz b:nth-child(1){font-size:14px}
.zzz b:nth-child(2){font-size:19px;animation-delay:.8s}
.zzz b:nth-child(3){font-size:25px;animation-delay:1.6s}
@keyframes floatZ{0%{transform:translate(0,0) rotate(-8deg) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(34px,-64px) rotate(12deg) scale(1.1);opacity:0}}
.heart-pop{position:absolute;top:44px;left:50%;width:0;height:0;z-index:2;pointer-events:none}
.heart-pop b{position:absolute;left:0;bottom:0;color:var(--blush);font-family:var(--f-display);font-size:22px;line-height:1;text-shadow:2px 2px 0 var(--panel);animation:heartFloat 1.1s ease-out both}
.heart-pop b:nth-child(2){font-size:28px;animation-delay:.12s}
.heart-pop b:nth-child(3){font-size:18px;animation-delay:.24s}
@keyframes heartFloat{0%{transform:translate(0,0) scale(.4);opacity:0}18%{opacity:1}100%{transform:translate(-30px,-72px) scale(1.1);opacity:0}}

@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hop{30%{transform:translateY(-22px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes cheer{25%{transform:translateY(-16px) rotate(-6deg)}50%{transform:translateY(0)}75%{transform:translateY(-16px) rotate(6deg)}}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.05)}}

/* ---------- Week ---------- */
.card{background:var(--panel);border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:14px}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.week-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.streak{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--honey)}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.label{font-family:var(--f-pixel);font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:12px;background:var(--panel-2);border:2px solid transparent;min-width:0}
.day.today{border-color:var(--honey)}
.day .dn{font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.day .dd{font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.day .ic{display:flex;gap:2px;height:16px;align-items:center}
.tag{font-family:var(--f-pixel);font-size:8px;background:var(--wood);color:var(--on-wood);border-radius:4px;padding:1px 3px}
.heart{width:13px;height:13px;color:var(--blush)}
.cardio-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:16px;height:16px;border-radius:5px;border:2px solid var(--blush);background:transparent}
.pip.on{background:var(--blush)}
.pips span{font-family:var(--f-display);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:14px;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--leaf);color:#23351a;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--leaf-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 1px 0 var(--leaf-deep)}
.btn.soft{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 4px 0 var(--edge)}
.btn.soft:active{box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 2px 0 var(--edge)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* ---------- Tabs ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:-19px;padding-inline:8px;position:relative;z-index:1}
.tab{border:0;border-radius:16px 16px 0 0;padding:10px 6px 14px;background:var(--wood);color:var(--on-wood);box-shadow:inset 0 3px 0 var(--wood-hi);display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .label{color:var(--on-wood);opacity:.8}
.tab b{font-family:var(--f-display);font-size:17px}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 -3px 0 var(--edge) inset,3px 0 0 var(--edge) inset,-3px 0 0 var(--edge) inset}
.tab[aria-selected="true"] .label{color:var(--muted)}
.list{border-radius:20px;display:flex;flex-direction:column;gap:12px;padding-top:18px}

/* ---------- Exercise ---------- */
.ex{background:var(--panel-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ex.done{background:var(--leaf-soft)}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;line-height:1.2}
.ex .scheme{font-family:var(--f-pixel);font-size:11px;color:var(--muted);margin-top:3px}
.wt-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.wt{display:flex;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:3px 8px;flex-shrink:0}
.wt input{width:44px;border:0;background:transparent;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.wt input::placeholder{color:var(--muted);opacity:.6}
.wt span{font-size:12px;color:var(--muted)}
.last{border:0;padding:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--edge);background:var(--panel);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--wood);border-color:var(--wood);color:var(--on-wood)}
.sets{display:flex;gap:8px}
.set{flex:1;height:48px;border-radius:14px;border:3px solid var(--edge);background:var(--panel);font-family:var(--f-display);font-weight:700;font-size:17px;display:grid;place-items:center;transition:transform .08s}
.set:active{transform:scale(.95)}
.set.on{background:var(--honey);border-color:var(--honey);color:#3d2a1f;box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}

.finish{width:100%;padding:15px;font-size:18px}
.finished{text-align:center;font-family:var(--f-display);font-weight:600;color:var(--leaf-deep);margin:0}

/* ---------- Timer ---------- */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.timer .sheet{max-width:480px;margin:0 auto;background:var(--panel);border:3px solid var(--edge);border-radius:24px;box-shadow:0 -4px 0 var(--edge),0 10px 40px rgba(0,0,0,.25);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ring{position:relative;width:112px;height:112px;grid-row:span 2}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.ring.ended .t{color:var(--leaf-deep)}
.tctrl{display:flex;gap:8px}
.tctrl .btn{flex:1;padding:10px 6px}
.rests{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.timer-title{font-family:var(--f-display);font-weight:600;font-size:15px}

/* ---------- Critter cheer popup ---------- */
.cheer-layer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;padding-inline:16px}
.cheer-card{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;animation:jumpIn .9s cubic-bezier(.3,1.4,.5,1) both;cursor:pointer}
.cheer-card.out{animation:jumpOut .45s ease-in both}
.cheer-bubble{position:relative;background:var(--panel);border:3px solid var(--ink);border-radius:18px;padding:10px 16px;max-width:260px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;box-shadow:0 5px 0 var(--ink)}
.cheer-bubble::after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:10px solid transparent;border-top-color:var(--ink);border-bottom:0}
.cheer-bubble small{display:block;font-family:var(--f-pixel);font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.critter{position:relative;width:200px;height:200px}
.critter canvas{width:200px;height:200px;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 8px 0 rgba(0,0,0,.18));animation:wiggle .5s ease-in-out .7s 2}
.spark{position:absolute;font-family:var(--f-pixel);color:var(--honey);font-size:22px;animation:twinkle .9s ease-in-out infinite}
.spark:nth-child(2){top:8px;left:10px}
.spark:nth-child(3){top:30px;right:4px;animation-delay:.3s;color:var(--blush)}
.spark:nth-child(4){bottom:40px;left:0;animation-delay:.55s;color:var(--leaf-deep)}
@keyframes jumpIn{0%{transform:translateY(70vh) scale(.6);opacity:0}55%{transform:translateY(-40px) scale(1.05,.95);opacity:1}75%{transform:translateY(0) scale(1.1,.88)}100%{transform:translateY(0) scale(1)}}
@keyframes jumpOut{30%{transform:translateY(-24px)}100%{transform:translateY(70vh) scale(.7);opacity:0}}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes twinkle{50%{transform:scale(1.4) rotate(20deg);opacity:.5}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="room" aria-label="Bowie's room">
    <div class="window"><span class="moon"></span></div>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="floor"></div>

    <div class="lvcard">
      <span class="pet">Bowie</span>
      <div class="lvrow"><span class="lv" id="lv">LV.1</span><div class="bar"><i id="lvbar" style="width:0%"></i></div></div>
      <small>Today EXP</small>
      <b><em id="exp">0</em>/100</b>
      <button class="outfit-btn" id="outfitBtn" type="button" aria-label="Customize Bowie's outfit"><span class="outfit-swatch-mini" id="outfitSwatch"></span><span class="outfit-copy"><small>Outfit</small><span id="outfitName">Classic band</span></span><span class="outfit-arrow" aria-hidden="true">›</span></button>
    </div>

    <div class="bubble" id="bubble">Hi! Ready to lift?</div>

    <div class="stage">
      <div class="rug"></div>
      <div class="mochi" id="mochi" role="button" tabindex="0" aria-label="Pet Bowie">
        <span class="zzz" id="zzz" hidden aria-hidden="true"><b>z</b><b>z</b><b>Z</b></span>
        <span class="heart-pop" id="heartPop" hidden aria-hidden="true"><b>♡</b><b>♥</b><b>♡</b></span>

<script>

    {id:"row",name:"Row",sets:3},

    {id:"latraise",name:"Lateral raise",sets:2},

    {id:"curl",name:"Bicep curl",sets:2},

const PICKS = {

// ---- dates

const monday = new Date(today); monday.setHours(0,0,0,0); monday.setDate(today.getDate()-((today.getDay()+6)%7));
const WEEK = [...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d});

// ---- state
const SKEY = "mochi-gym-v1";
let S = {date:TODAY,done:{d1:{},d2:{}},w:{},last:{},pick:{},cardio:[],lifts:{},total:0,rest:90,tab:null,outfit:0};
try{
  const raw = localStorage.getItem(SKEY);
  if(raw){
    const saved = JSON.parse(raw);
    if(saved && typeof saved === "object") S = Object.assign(S, saved);
  }
  if(!S.done || typeof S.done !== "object") S.done={};
  if(!S.done.d1 || typeof S.done.d1 !== "object") S.done.d1={};
  if(!S.done.d2 || typeof S.done.d2 !== "object") S.done.d2={};
  if(!S.w || typeof S.w !== "object") S.w={};
  if(!S.last || typeof S.last !== "object") S.last={};
  if(!S.pick || typeof S.pick !== "object") S.pick={};
  if(!Array.isArray(S.cardio)) S.cardio=[];
  if(!S.lifts || typeof S.lifts !== "object") S.lifts={};
  if(!Number.isFinite(S.rest) || S.rest<=0) S.rest=90;
  if(!Number.isInteger(S.outfit) || S.outfit<0) S.outfit=0;
}catch(e){}
if(S.date!==TODAY){ S.date=TODAY; S.done={d1:{},d2:{}}; }
const save = () => { try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} };

const OUTFITS = [
  {level:1,name:"Classic band",light:"#c8e6a8",mid:"#86b563",dark:"#4e7936"},
  {level:2,name:"Sunset band",light:"#ffd39a",mid:"#f3a451",dark:"#bb6329"},
  {level:3,name:"Berry band",light:"#f6b9d0",mid:"#d96b9a",dark:"#8e3d67"},

];
const unlockedOutfits = () => OUTFITS.filter(o=>o.level<=Math.floor(S.total/3)+1);
const activeOutfit = () => { const unlocked=unlockedOutfits(); return unlocked[Math.min(S.outfit,unlocked.length-1)]; };

// pick today's day: continue whatever's in progress, else alternate from last lift
if(!S.tab || !S.done[S.tab] || !Object.keys(S.done[S.tab]).length){
  if(S.lifts[TODAY]) S.tab = S.lifts[TODAY];
  else { const last = Object.keys(S.lifts).sort().pop(); S.tab = last ? (S.lifts[last]==="d1"?"d2":"d1") : "d1"; }
}

// ---- mascot
const mochi = $("mochi"), bubble = $("bubble"), heartPop = $("heartPop");
let petTimer=null;
function say(t, anim="hop"){
  bubble.textContent = t; bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");

function sleepy(on){ $("bowieAwake").hidden=on; $("bowieSleep").hidden=!on; $("zzz").hidden=!on; }
function petBowie(){
  clearTimeout(petTimer);
  heartPop.hidden=false;
  heartPop.querySelectorAll("b").forEach(heart=>{
    heart.style.animation="none";
    void heart.offsetWidth;
    heart.style.animation="";

}
mochi.addEventListener("click",petBowie);
mochi.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); petBowie(); }});

// ---- Bowie sprite: painted as a shaded SVG, then crunched to a tiny low-res texture
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bowieSVG(asleep){
  const r = mulberry(7), R=(a,b)=>a+r()*(b-a), P=a=>a[Math.floor(r()*a.length)], outfit=activeOutfit();
  const strand=(x,y,dx,dy,c,w,o)=>`<path d="M${x.toFixed(1)} ${y.toFixed(1)}q${(dx*.5+R(-2,2)).toFixed(1)} ${(dy*.5).toFixed(1)} ${dx.toFixed(1)} ${dy.toFixed(1)}" stroke="${c}" stroke-width="${w}" opacity="${o}" fill="none" stroke-linecap="round"/>`;
  const many=(n,f)=>Array.from({length:n},f).join("");
  const FUR=["#f3e3c4","#dcc298","#c4a778","#9c7c52"], FACE=["#fffaf0","#f2e8d6","#e2d2b6"], EAR=["#b8875a","#8f633d","#6f4b2c","#c99a68"], TAIL=["#b07a4c","#7e5334","#5c3a23"];
  const eyes = asleep
    ? `<path d="M50 64q4 3 8 0M72 64q4 3 8 0" stroke="#1a120e" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="54" cy="63" rx="5.2" ry="5.8" fill="url(#eyeG)"/><ellipse cx="76" cy="63" rx="5.2" ry="5.8" fill="url(#eyeG)"/>
       <circle cx="56" cy="61" r="2" fill="#fff"/><circle cx="78" cy="61" r="2" fill="#fff"/><circle cx="52.6" cy="65" r=".9" fill="#fff" opacity=".8"/><circle cx="74.6" cy="65" r=".9" fill="#fff" opacity=".8"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 140"><defs>
    <radialGradient id="bodyG" cx="38%" cy="28%" r="78%"><stop offset="0" stop-color="#f3e3c4"/><stop offset=".55" stop-color="#d8bd91"/><stop offset="1" stop-color="#94744b"/></radialGradient>
    <radialGradient id="headG" cx="40%" cy="30%" r="72%"><stop offset="0" stop-color="#f6ead2"/><stop offset=".6" stop-color="#dcc298"/><stop offset="1" stop-color="#a1825a"/></radialGradient>
    <radialGradient id="faceG" cx="50%" cy="42%" r="55%"><stop offset="0" stop-color="#fdf8ef"/><stop offset=".6" stop-color="#efe3cc"/><stop offset="1" stop-color="#e6d6b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="chestG" cx="50%" cy="35%" r="60%"><stop offset="0" stop-color="#f8ecd6"/><stop offset="1" stop-color="#f3e3c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="legG" x1="0" x2="1"><stop offset="0" stop-color="#b9996b"/><stop offset=".4" stop-color="#e6d0a8"/><stop offset="1" stop-color="#a8885c"/></linearGradient>
    <linearGradient id="earG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c29363"/><stop offset=".6" stop-color="#8f633d"/><stop offset="1" stop-color="#5e3f25"/></linearGradient>
    <radialGradient id="tailG" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#b98253"/><stop offset=".6" stop-color="#7e5334"/><stop offset="1" stop-color="#4a2f1c"/></radialGradient>
    <linearGradient id="bandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${outfit.light}"/><stop offset=".5" stop-color="${outfit.mid}"/><stop offset="1" stop-color="${outfit.dark}"/></linearGradient>
    <radialGradient id="eyeG" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4a342a"/><stop offset="1" stop-color="#0b0806"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f4"/><stop offset=".5" stop-color="#9a9ca6"/><stop offset="1" stop-color="#55575f"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c86c4"/><stop offset=".5" stop-color="#3f5796"/><stop offset="1" stop-color="#26355e"/></linearGradient>
  </defs>
  <ellipse cx="65" cy="134" rx="48" ry="6" fill="#000" opacity=".2"/>
  <path d="M92 120C114 118 126 96 119 76c-4-10-15-8-14 3 5 5 3 22-12 28z" fill="url(#tailG)"/>
  ${many(34,()=>strand(R(96,120),R(74,114),R(3,8),R(-6,4),P(TAIL),R(1.5,2.6),.7))}
  <path d="M27 134C21 108 34 84 65 82s44 26 38 52z" fill="url(#bodyG)"/>
  ${many(70,()=>strand(R(30,100),R(88,124),R(-2,2),R(5,9),P(FUR),R(1,1.8),.28))}
  <ellipse cx="65" cy="102" rx="19" ry="17" fill="url(#chestG)"/>
  <rect x="40" y="128" width="50" height="4" rx="2" fill="url(#metal)"/>
  <rect x="33" y="122" width="9" height="15" rx="2" fill="url(#plate)"/><rect x="88" y="122" width="9" height="15" rx="2" fill="url(#plate)"/>
  <path d="M46 116c-1 6-1 11 0 15h13c0-5 0-10-1-15z" fill="url(#legG)" opacity=".85"/>
  <path d="M84 116c1 6 1 11 0 15H71c0-5 0-10 1-15z" fill="url(#legG)" opacity=".85"/>
  ${many(10,()=>strand(R(47,58),R(115,124),R(-1,1),R(5,8),P(FUR),1.2,.25))}${many(10,()=>strand(R(72,83),R(115,124),R(-1,1),R(5,8),P(FUR),1.2,.25))}
  <ellipse cx="52" cy="130" rx="10" ry="6.5" fill="#f4e7cf"/><ellipse cx="78" cy="130" rx="10" ry="6.5" fill="#f4e7cf"/><ellipse cx="50" cy="127.5" rx="5" ry="2.5" fill="#fff" opacity=".6"/><ellipse cx="76" cy="127.5" rx="5" ry="2.5" fill="#fff" opacity=".6"/><path d="M49 131v4M55 131v4M75 131v4M81 131v4" stroke="#a88a60" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="65" cy="88" rx="27" ry="7" fill="#3d2a1f" opacity=".22"/>
  <ellipse cx="65" cy="57" rx="33" ry="31" fill="url(#headG)"/>
  ${many(80,()=>{const a=R(0,Math.PI*2),x=65+Math.cos(a)*29,y=57+Math.sin(a)*27;return strand(x,y,Math.cos(a)*R(4,9),Math.sin(a)*R(4,9)+3,P(FUR),R(1.6,2.6),.8)})}
  <path d="M37 44C24 50 19 74 23 99c5 5 12 2 15-4 2-18 4-34 7-49z" fill="url(#earG)"/>
  <path d="M93 44c13 6 18 30 14 55-5 5-12 2-15-4-2-18-4-34-7-49z" fill="url(#earG)"/>
  ${many(34,()=>strand(R(24,42),R(48,90),R(-2,1),R(8,14),P(EAR),R(1.4,2.4),.75))}${many(34,()=>strand(R(88,106),R(48,90),R(-1,2),R(8,14),P(EAR),R(1.4,2.4),.75))}
  <ellipse cx="65" cy="67" rx="25" ry="24" fill="url(#faceG)"/>
  ${eyes}
  <path d="M33 41c18-12 46-12 64 0l-2 9c-17-10-43-10-60 0z" fill="url(#bandG)"/>
  <path d="M38 41c16-8 38-8 54 0" stroke="#fff" stroke-width="1.4" opacity=".45" fill="none"/>
  ${many(46,()=>{const x=R(42,88);return strand(x,R(42,46),(x-65)*.12+R(-2,2),R(6,10),P(FACE.concat(["#dcc298"])),R(1.8,2.8),.72)})}
  <ellipse cx="65" cy="79" rx="13" ry="10" fill="#f6ecdb"/>
  ${many(30,()=>strand(R(53,77),R(77,84),R(-1.5,1.5),R(7,13),P(FACE),R(1.6,2.4),.8))}
  <ellipse cx="65" cy="73" rx="5.8" ry="4.2" fill="#17110e"/><ellipse cx="63.4" cy="71.8" rx="1.8" ry="1.1" fill="#fff" opacity=".55"/>
  <path d="M57 78.5q8 11 16 0z" fill="#3a1d18"/>
  <path d="M60.5 80.5h9v6.5q-4.5 6-9 0z" fill="#f07e8e"/><path d="M65 81v6" stroke="#c4566a" stroke-width="1.3"/><ellipse cx="62.6" cy="83" rx="1.2" ry="1.6" fill="#ffc4cc" opacity=".8"/>
  <path d="M55 77q5 5 10 1q5 4 10-1" stroke="#2a1a14" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="46" cy="73" rx="5" ry="3" fill="#f4a3a8" opacity=".45"/><ellipse cx="84" cy="73" rx="5" ry="3" fill="#f4a3a8" opacity=".45"/>
</svg>`;
}
function paintBowie(canvas, asleep){
  const img=new Image(), W=canvas.width, H=canvas.height;
  img.onload=()=>{
    const ctx=canvas.getContext("2d"); ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0,W,H);
    let d; try{ d=ctx.getImageData(0,0,W,H); }catch(e){ return; }
    const px=d.data, r=mulberry(42), B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5], step=10;
    const solid=new Uint8Array(W*H);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const i=(y*W+x)*4;
      if(px[i+3]<110){ px[i+3]=0; continue; }
      solid[y*W+x]=1; px[i+3]=255;
      const n=(r()-.5)*7, dz=(B[(y&3)*4+(x&3)]/16-.5)*step*.6;
      for(let c=0;c<3;c++){ px[i+c]=Math.max(0,Math.min(255,Math.round((px[i+c]+n+dz)/step)*step)); }
    }
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      if(solid[y*W+x]) continue;
      const near=(x>0&&solid[y*W+x-1])||(x<W-1&&solid[y*W+x+1])||(y>0&&solid[(y-1)*W+x])||(y<H-1&&solid[(y+1)*W+x]);
      if(near){ const i=(y*W+x)*4; px[i]=92;px[i+1]=66;px[i+2]=44;px[i+3]=110; }
    }
    ctx.putImageData(d,0,0);
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(bowieSVG(asleep));
}
paintBowie($("bowieAwake"),false); paintBowie($("bowieSleep"),true);

// ---- EXP / level
let renderedOutfit="";
function totals(){
  const r = ROUTINE[S.tab]; let all=0, done=0;
  r.ex.forEach(e=>{ all+=e.sets; done+=(S.done[S.tab][e.id]||[]).filter(Boolean).length; });
  return {all,done};
}
function renderExp(){
  const {all,done} = totals();
  const exp = S.lifts[TODAY] ? 100 : Math.round(done/all*100);
  $("exp").textContent = exp;
  const lvl = Math.floor(S.total/3)+1, prog = (S.total%3)/3*100;
  $("lv").textContent = "LV."+lvl; $("lvbar").style.width = (prog||(S.total?4:0))+"%";
  const outfit=activeOutfit();
  $("outfitName").textContent=outfit.name;
  $("outfitSwatch").style.setProperty("--outfit-light",outfit.light);
  $("outfitSwatch").style.setProperty("--outfit-mid",outfit.mid);
  $("outfitSwatch").style.setProperty("--outfit-dark",outfit.dark);
  if(outfit.name!==renderedOutfit){ paintBowie($("bowieAwake"),false); paintBowie($("bowieSleep"),true); renderedOutfit=outfit.name; }
}
function renderOutfits(){
  const unlocked=unlockedOutfits(), active=activeOutfit();
  $("outfits").innerHTML=OUTFITS.map((outfit,index)=>{
    const open=outfit.level<=unlocked.length, selected=open&&outfit.name===active.name;
    return `<button type="button" class="outfit-option" data-outfit="${index}" aria-pressed="${selected}"${open?"":" disabled"} style="--outfit-light:${outfit.light};--outfit-mid:${outfit.mid};--outfit-dark:${outfit.dark}">
      <span class="outfit-swatch"></span><b>${outfit.name}</b><small>${open?`Level ${outfit.level}${selected?" · Wearing":""}`:`Unlocks at LV.${outfit.level}`}</small>${selected?'<span class="outfit-check">✓</span>':""}
    </button>`;
  }).join("");
}
function openOutfits(){ $("outfitSheet").hidden=false; renderOutfits(); $("outfitClose").focus(); }
function closeOutfits(){ $("outfitSheet").hidden=true; $("outfitBtn").focus(); }
$("outfitBtn").addEventListener("click",()=>{
  openOutfits();
});
$("outfitClose").addEventListener("click",closeOutfits);
$("outfitSheet").addEventListener("click",e=>{
  if(e.target===$("outfitSheet")){ closeOutfits(); return; }
  const option=e.target.closest("[data-outfit]"); if(!option) return;
  const unlocked=unlockedOutfits(), index=+option.dataset.outfit;
  if(index>=unlocked.length) return;
  S.outfit=index; save(); renderExp(); renderOutfits(); say(`${activeOutfit().name}!`);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("outfitSheet").hidden) closeOutfits(); });

// ---- week
const HEART = '<svg class="heart" viewBox="0 0 16 16"><path fill="currentColor" d="M8 14s-6-3.7-6-8a3.2 3.2 0 0 1 6-1.6A3.2 3.2 0 0 1 14 6c0 4.3-6 8-6 8z"/></svg>';
function weekStats(start){
  const liftDays = new Set(), days=[];
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); days.push(d);
    const lift=S.lifts[key(d)];
    if(lift) liftDays.add(lift);
  }
  return {liftDays,cardio:days.filter(d=>S.cardio.includes(key(d))).length};
}
function weekQualifies(start){
  const stats=weekStats(start);
  return stats.liftDays.has("d1")&&stats.liftDays.has("d2")&&stats.cardio>=4;
}
function streakCount(){
  const cursor=new Date(monday); let streak=0;
  if(!weekQualifies(cursor)) cursor.setDate(cursor.getDate()-7);
  while(weekQualifies(cursor)){ streak++; cursor.setDate(cursor.getDate()-7); }
  return streak;
}
function renderWeek(){
  const f = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const stats=weekStats(monday);
  $("weekRange").textContent = `${f(WEEK[0])} – ${f(WEEK[6])}`;
  $("streak").textContent = `🔥 ${streakCount()}-week streak`;
  $("weekHint").textContent = `Goal: 2 lift days + 4 cardio sessions. This week: ${stats.liftDays.size}/2 lift days, ${Math.min(stats.cardio,4)}/4 cardio.`;
  $("days").innerHTML = WEEK.map(d=>{
    const k=key(d), lift=S.lifts[k], c=S.cardio.includes(k);
    return `<button type="button" class="day${k===TODAY?" today":""}" data-k="${k}" aria-label="${d.toLocaleDateString(undefined,{weekday:"long"})}${lift?", "+ROUTINE[lift].name+" day done":""}${c?", cardio done":""}">
      <span class="dn">${"MTWTFSS"[WEEK.indexOf(d)]}</span><span class="dd">${d.getDate()}</span>
      <span class="ic">${lift?`<span class="tag">${lift==="d1"?"D1":"D2"}</span>`:""}${c?HEART:""}</span></button>`;
  }).join("");
  const n = WEEK.filter(d=>S.cardio.includes(key(d))).length;
  $("pips").innerHTML = [...Array(5)].map((_,i)=>`<i class="pip${i<n?" on":""}"></i>`).join("")+`<span>${n}/5 cardio</span>`;
  $("cardioBtn").textContent = S.cardio.includes(TODAY) ? "✓ Cardio today" : "+ Cardio today";
}
function toggleCardio(k){
  const i=S.cardio.indexOf(k);
  if(i>=0) S.cardio.splice(i,1); else { S.cardio.push(k); say(pick(LINES.cardio),"cheer"); }
  save(); renderWeek();
}
$("days").addEventListener("click",e=>{const b=e.target.closest(".day"); if(b) toggleCardio(b.dataset.k)});
$("cardioBtn").addEventListener("click",()=>toggleCardio(TODAY));

// ---- tabs + list
function renderTabs(){
  $("tabs").innerHTML = Object.entries(ROUTINE).map(([id,r])=>
    `<button type="button" role="tab" class="tab" data-id="${id}" aria-selected="${id===S.tab}"><span class="label">${r.tab}</span><b>${r.name}</b></button>`).join("");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab"); if(!b) return; S.tab=b.dataset.id; save(); renderTabs(); renderList(); renderExp();});

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderList(){
  const r = ROUTINE[S.tab], d = S.done[S.tab];
  const doneToday = S.lifts[TODAY]===S.tab;
  const {all: totalSets, done: completedSets} = totals();
  $("list").innerHTML = r.ex.map(e=>{
    const sets = d[e.id]||[], all = sets.filter(Boolean).length===e.sets;
    const chosen = S.pick[e.id];
    const last = S.last[e.id];
    return `<div class="ex${all?" done":""}" data-id="${e.id}">
      <div class="ex-top">
        <div><h3>${esc(chosen||e.name)}</h3><div class="scheme">${e.sets} sets · ${REPS}</div></div>
        <div class="wt-wrap"><label class="wt"><input id="w-${e.id}" inputmode="decimal" placeholder="—" value="${esc(S.w[e.id]||"")}" aria-label="${esc(e.name)} weight"><span>lb</span></label>${last!==undefined&&last!==""?`<button type="button" class="last" data-last="${esc(last)}" aria-label="Use last ${esc(last)} pounds for ${esc(e.name)}">Last: ${esc(last)} lb</button>`:""}</div>
      </div>
      ${e.pick?`<div class="chips">${PICKS[e.pick].map(p=>`<button type="button" class="chip" data-pick="${esc(p)}" aria-pressed="${chosen===p}">${esc(p)}</button>`).join("")}</div>`:""}
      <div class="sets">${[...Array(e.sets)].map((_,i)=>`<button type="button" class="set${sets[i]?" on":""}" data-set="${i}" aria-pressed="${!!sets[i]}" aria-label="Set ${i+1}">${sets[i]?"✓":i+1}</button>`).join("")}</div>
    </div>`;
  }).join("") + (doneToday
    ? `<p class="finished">${r.name} day saved for today ♡</p>`
    : `<button type="button" class="btn finish" id="finish"${completedSets<totalSets?" disabled":""}>${completedSets<totalSets?`Complete ${totalSets-completedSets} more set${totalSets-completedSets===1?"":"s"} to finish`:"Finish workout"}</button>`);
}
$("list").addEventListener("click",e=>{
  const card = e.target.closest(".ex");
  if(e.target.id==="finish"){ finish(); return; }
  if(!card) return;
  const id = card.dataset.id;
  const chip = e.target.closest(".chip");
  if(chip){ S.pick[id] = S.pick[id]===chip.dataset.pick ? "" : chip.dataset.pick; save(); renderList(); return; }
  const setBtn = e.target.closest(".set");
  if(setBtn){
    unlockAudio();
    const i=+setBtn.dataset.set, arr = S.done[S.tab][id] = S.done[S.tab][id]||[];
    arr[i] = !arr[i]; save(); renderList(); renderExp();
    if(arr[i]){
      critterCheer();
      const {all,done} = totals();
      if(done<all){ say(pick(LINES.set)); startTimer(S.rest); }
      else { stopTimer(); say("Last set done! Tap Finish ♡","cheer"); }
    }
  }
  const lastBtn = e.target.closest(".last");
  if(lastBtn){
    const input=$("w-"+id);
    input.value=lastBtn.dataset.last; S.w[id]=input.value; save(); input.focus();
  }
});
$("list").addEventListener("input",e=>{ if(e.target.id?.startsWith("w-")){ S.w[e.target.id.slice(2)] = e.target.value; save(); }});

function finish(){
  const {all,done} = totals();
  if(done<all || S.lifts[TODAY]) return;
  const r = ROUTINE[S.tab];
  const prs = r.ex.filter(e=>{
    const current=Number(S.w[e.id]), previous=Number(S.last[e.id]);
    return Number.isFinite(current)&&Number.isFinite(previous)&&current>previous;
  });
  r.ex.forEach(e=>{ if(String(S.w[e.id]||"").trim()) S.last[e.id]=S.w[e.id]; });
  S.lifts[TODAY]=S.tab; S.total++; save(); stopTimer();
  renderList(); renderExp(); renderWeek(); say(prs.length?"New PR! Bowie is impressed!":pick(LINES.done),"cheer");
  if(prs.length) critterCheer("New PR! Bowie is impressed!");
}

// ---- sound
let actx=null;
function unlockAudio(){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); }catch(e){} }
function chime(){
  if(!actx) return;
  const t=actx.currentTime;
  [659,784,1047].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="square"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+i*.12); g.gain.exponentialRampToValueAtTime(.12,t+i*.12+.02); g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.25);
    o.connect(g).connect(actx.destination); o.start(t+i*.12); o.stop(t+i*.12+.3);
  });
}

// ---- timer
const C = 326.7;
let endAt=0, total=0, paused=null, tick=null, lock=null;
const fmt = s => `${Math.floor(s/60)}:${pad(Math.max(0,s)%60)}`;
function renderRests(){
  $("rests").innerHTML = '<span class="label">Rest</span>'+[60,90,120].map(s=>`<button type="button" class="chip" data-rest="${s}" aria-pressed="${S.rest===s}">${s}s</button>`).join("");
}
$("rests").addEventListener("click",e=>{const b=e.target.closest("[data-rest]"); if(!b) return; S.rest=+b.dataset.rest; save(); renderRests(); startTimer(S.rest);});
function startTimer(sec){
  total=sec; endAt=Date.now()+sec*1000; paused=null;
  $("timer").hidden=false; $("ring").classList.remove("ended"); $("tpause").textContent="Pause"; $("tlabel").textContent="Resting…";
  sleepy(true); renderRests(); clearInterval(tick); tick=setInterval(update,200); update();
  try{ navigator.wakeLock?.request("screen").then(l=>lock=l).catch(()=>{}); }catch(e){}
}
function update(){
  const left = paused!=null ? paused : Math.ceil((endAt-Date.now())/1000);
  $("tnum").textContent = fmt(Math.max(0,left));
  $("arc").style.strokeDashoffset = C*(1-Math.max(0,left)/total);
  if(left<=0 && paused==null){
    clearInterval(tick); $("ring").classList.add("ended"); $("tlabel").textContent="Time's up!";
    sleepy(false); say(pick(LINES.go),"cheer"); chime();
    try{ navigator.vibrate?.([200,100,200]); }catch(e){}
    setTimeout(()=>{ if(!$("ring").classList.contains("ended")) return; stopTimer(); },4000);
  }
}
function stopTimer(){ clearInterval(tick); $("timer").hidden=true; sleepy(false); try{ lock?.release(); }catch(e){} lock=null; }
$("tplus").addEventListener("click",()=>{ if(paused!=null){paused+=15;} else {endAt+=15000;} total+=15; update(); });
$("tpause").addEventListener("click",()=>{
  if(paused==null){ paused=Math.ceil((endAt-Date.now())/1000); $("tpause").textContent="Resume"; }
  else { endAt=Date.now()+paused*1000; paused=null; $("tpause").textContent="Pause"; tick=setInterval(update,200); }
  if(paused!=null) clearInterval(tick);
  update();
});
$("tskip").addEventListener("click",()=>{ stopTimer(); say(pick(LINES.go)); });

// ---- critter cheer (low-res "PS2" pop-up buddies)
const FUR = (id,a,b,c) => `<radialGradient id="${id}" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset=".65" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
const OL = 'stroke="#2b1d16" stroke-width="3.5" stroke-linejoin="round"';
const FACE = (mouth) => `
  <ellipse cx="40" cy="50" rx="3.6" ry="4.4" fill="#2b1d16"/><ellipse cx="60" cy="50" rx="3.6" ry="4.4" fill="#2b1d16"/>
  <circle cx="41.3" cy="48.4" r="1.3" fill="#fff"/><circle cx="61.3" cy="48.4" r="1.3" fill="#fff"/>
  <ellipse cx="32" cy="59" rx="5" ry="3" fill="#f4a3a8" opacity=".85"/><ellipse cx="68" cy="59" rx="5" ry="3" fill="#f4a3a8" opacity=".85"/>
  ${mouth}`;
const BODY = (g) => `
  <ellipse cx="50" cy="96" rx="24" ry="3" fill="#000" opacity=".12"/>
  <ellipse cx="50" cy="80" rx="21" ry="16" fill="url(#${g})" ${OL}/>
  <ellipse cx="41" cy="94" rx="7" ry="4" fill="url(#${g})" ${OL}/><ellipse cx="59" cy="94" rx="7" ry="4" fill="url(#${g})" ${OL}/>
  <ellipse cx="25" cy="62" rx="6" ry="9" transform="rotate(-35 25 62)" fill="url(#${g})" ${OL}/>
  <ellipse cx="75" cy="62" rx="6" ry="9" transform="rotate(35 75 62)" fill="url(#${g})" ${OL}/>`;
const HEAD = (g) => `<circle cx="50" cy="50" r="25" fill="url(#${g})" ${OL}/><ellipse cx="41" cy="37" rx="8" ry="5" fill="#fff" opacity=".7"/>`;
const wrap = (defs, inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>${defs}</defs>${inner}</svg>`;

const CRITTERS = [
  {name:"Kitten", svg: wrap(FUR("k","#ffffff","#f1ebe4","#cbbfb2"), `
    <path d="M70 84q20 0 16-18" fill="none" stroke="#2b1d16" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 84q20 0 16-18" fill="none" stroke="#f6f0ea" stroke-width="3.5" stroke-linecap="round"/>
    ${BODY("k")}
    <path d="M28 38 L30 14 L47 29 Z" fill="#f2b27a" ${OL}/><path d="M72 38 L70 14 L53 29 Z" fill="url(#k)" ${OL}/>
    <path d="M32 31 L32.5 21 L40 28 Z" fill="#f4a3a8"/><path d="M68 31 L67.5 21 L60 28 Z" fill="#f4a3a8"/>
    ${HEAD("k")}
    ${FACE('<path d="M45 58q2.5 3 5 0q2.5 3 5 0" fill="none" stroke="#2b1d16" stroke-width="2.4" stroke-linecap="round"/><path d="M22 55h-7M22 59l-6 2M78 55h7M78 59l6 2" stroke="#2b1d16" stroke-width="1.8" stroke-linecap="round"/>')}`)},
  {name:"Puppy", svg: wrap(FUR("p","#fffaf0","#f5e6cf","#d4bb9a"), `
    <path d="M70 80q14-4 13-16" fill="none" stroke="#2b1d16" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 80q14-4 13-16" fill="none" stroke="#f5e6cf" stroke-width="3.5" stroke-linecap="round"/>
    ${BODY("p")}
    ${HEAD("p")}
    <ellipse cx="60" cy="50" rx="8" ry="8.5" fill="#c9976b" opacity=".8"/>
    <ellipse cx="26" cy="46" rx="9" ry="16" transform="rotate(22 26 46)" fill="#8b5a3c" ${OL}/>
    <ellipse cx="74" cy="46" rx="9" ry="16" transform="rotate(-22 74 46)" fill="#8b5a3c" ${OL}/>
    ${FACE('<ellipse cx="50" cy="56" rx="3.4" ry="2.4" fill="#2b1d16"/><path d="M45 60q5 4 10 0" fill="none" stroke="#2b1d16" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="50" cy="64" rx="3.2" ry="3.8" fill="#f07c8a" stroke="#2b1d16" stroke-width="1.8"/>')}`)},
  {name:"Bunny", svg: wrap(FUR("b","#ffffff","#f3eef2","#cdc2cc"), `
    <circle cx="71" cy="86" r="6" fill="url(#b)" ${OL}/>
    ${BODY("b")}
    <ellipse cx="39" cy="17" rx="7.5" ry="19" transform="rotate(-10 39 17)" fill="url(#b)" ${OL}/>
    <ellipse cx="61" cy="17" rx="7.5" ry="19" transform="rotate(10 61 17)" fill="url(#b)" ${OL}/>
    <ellipse cx="39" cy="18" rx="3.2" ry="13" transform="rotate(-10 39 18)" fill="#f4a3a8"/>
    <ellipse cx="61" cy="18" rx="3.2" ry="13" transform="rotate(10 61 18)" fill="#f4a3a8"/>
    ${HEAD("b")}
    ${FACE('<path d="M47.5 55.5h5l-2.5 2.8z" fill="#f07c8a"/><path d="M45 59q2.5 3 5 0q2.5 3 5 0" fill="none" stroke="#2b1d16" stroke-width="2.4" stroke-linecap="round"/><rect x="47.8" y="61" width="4.4" height="4" rx="1" fill="#fff" stroke="#2b1d16" stroke-width="1.4"/>')}`)}
];
CRITTERS.forEach(c=>{ c.img=new Image(); c.img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(c.svg); });

const COMPLIMENTS = [
  "You're so strong!!","Look at those gains!","Perfect form, wow","Queen of the gym ♡","Stronger than yesterday!",
  "You make this look easy","That set was elite","Main character energy","Absolute powerhouse","Your glutes say thank you",
  "Pretty AND strong? Unfair","Legendary set!","You're glowing ✧","Future you says thanks","10/10 set, no notes",
  "Built different","Critical hit! +10 STR","New high score!","You're doing amazing ♡","So proud of you!!",
  "Unstoppable!","Muscles loading…","Cutest lifter ever","That was so clean!","Boss level unlocked"
];
const TAGS = ["SET CLEAR!","NICE COMBO!","+EXP","LEVEL UP?","PERFECT!"];
let lastC = -1, cheerTimers = [];
function boing(){
  if(!actx) return;
  const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type="square"; o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(900,t+.14);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.22);
}
function critterCheer(message=""){
  cheerTimers.forEach(clearTimeout); cheerTimers=[];
  const layer=$("cheerLayer"); layer.innerHTML="";
  const c = pick(CRITTERS);
  let i; do{ i=Math.floor(Math.random()*COMPLIMENTS.length); }while(i===lastC); lastC=i;
  const card=document.createElement("div"); card.className="cheer-card";
  card.innerHTML=`<div class="cheer-bubble"><small>${c.name.toUpperCase()} · ${message?"NEW PR!":pick(TAGS)}</small>${esc(message||COMPLIMENTS[i])}</div>
    <div class="critter"><span class="spark">✦</span><span class="spark">✧</span><span class="spark">✦</span></div>`;
  const cv=document.createElement("canvas"); cv.width=cv.height=80;
  const draw=()=>{ try{ cv.getContext("2d").drawImage(c.img,0,0,80,80); }catch(e){} };
  c.img.complete ? draw() : c.img.addEventListener("load",draw,{once:true});
  card.querySelector(".critter").prepend(cv);
  layer.appendChild(card); boing();
  const leave=()=>{ card.classList.add("out"); cheerTimers.push(setTimeout(()=>card.remove(),450)); };
  card.addEventListener("click",leave,{once:true});
  cheerTimers.push(setTimeout(leave,2400));
}

// ---- boot
renderOutfits();
renderTabs(); renderList(); renderWeek(); renderExp();
if(S.lifts[TODAY]) say("You already trained today ♡","cheer");
else say(`Bowie here! ${ROUTINE[S.tab].name} day, let's go`);
})();
</script>
